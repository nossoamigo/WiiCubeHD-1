<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- aplica o modo escuro salvo ANTES da página aparecer (evita o "piscar" claro) -->
    <script>
      try {
        if (localStorage.getItem('tema') === 'escuro') document.documentElement.setAttribute('data-tema', 'escuro');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courgette&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="shortcut icon" href="../imagens/favicon/favicon.ico" type="image/x-icon" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="tema.css" />
    <title>Seletor de jogos</title>
  </head>
  <body>
    <!-- Formulário: o envio é feito pelo app.js (com servidor reserva) -->
    <form id="meu-formulario">
      <div class="campos">
        <label for="input-nome-id">Nome:</label>
        <input type="text" name="name" id="input-nome-id" required />
        <!-- Chave do modo escuro: Yoshi verde (claro) / Yoshi preto (escuro). No computador fica fixa ao lado do botão de música. -->
        <button type="button" id="chaveTema" class="chaveTema" role="switch" aria-checked="false" aria-label="Modo escuro" title="Ativar modo escuro">
          <span class="chaveTrilho"></span>
          <span class="chaveBotao">
            <img class="yoshi yoshi-claro" src="../imagens/yoshi/yoshi-verde.png" alt="" />
            <img class="yoshi yoshi-escuro" src="../imagens/yoshi/yoshi-preto.png" alt="" />
          </span>
        </button>
        <label for="input-telefone-id">Telefone:</label>
        <input type="tel" name="phone" id="input-telefone-id" inputmode="tel" autocomplete="tel" placeholder="(41) 99999-9999" maxlength="15" />
        <small class="opcional">(opcional)</small>
      </div>
      <textarea name="message" id="text-area-id" cols="30" rows="10" readonly></textarea>
      <button id="botaoDeEnviar" type="submit">Enviar pedido</button>
    </form>

    <!-- Os botões de HD/Pendrive são criados a partir de dados/config.json -->
    <div class="tamanhoHd" id="seletorHd"></div>
    <div class="tamanhoRealMensagem" id="tamanhoRealMensagemId"></div>

    <div class="seletorConsole">
      <div class="seletorConsoleItem ativo" data-console="wii">Wii</div>
      <div class="seletorConsoleItem" data-console="gamecube">GameCube</div>
    </div>

    <div class="buscaContainer">
      <input type="search" id="campoBusca" placeholder="Buscar jogo pelo nome..." autocomplete="off" />
      <p id="buscaVazia">Nenhum jogo encontrado</p>
      <p id="legendaSelos"></p>
    </div>

    <!-- Filtros criados a partir de dados/filtros.json -->
    <div id="filtrosContainer"></div>

    <!-- Letras A-Z geradas automaticamente -->
    <div class="container-navegacao" id="container-navegacaoId"></div>

    <div class="container-jogo" id="container-jogo"></div>
    <div class="container-jogo" id="container-jogo-gamecube"></div>

    <!-- Medidor de capacidade: barra que enche como um líquido (atualizada pelo app.js) -->
    <div class="res" id="resultado" role="progressbar" aria-label="Capacidade usada" aria-valuemin="0" aria-valuemax="100">
      <div class="resNivel" id="resultadoNivel"></div>
      <span class="resTexto" id="resultadoTexto"></span>
    </div>

    <!-- Quadro de recados: conteúdo vem de dados/recados.json -->
    <aside id="quadroRecados" hidden>
      <div id="quadroRecadosCabecalho">
        <button type="button" id="quadroRecadosTitulo" aria-expanded="false">
          <span class="material-icons">push_pin</span> <span class="quadroRecadosRotulo">Recados</span> <span id="quadroRecadosQtd"></span>
        </button>
        <button type="button" id="quadroRecadosFechar" aria-label="Fechar recados" title="Fechar">
          <span class="material-icons">close</span>
        </button>
      </div>
      <div id="quadroRecadosLista"></div>
    </aside>

    <div id="audio"><span class="material-icons" id="idDoAudio">music_note</span></div>

    <div class="container-botao-voltar-ao-inicio" id="botaoVoltarAoInicio">
      <span class="material-icons" id="idDoBotaoDeVoltarAoTopo">expand_less</span>
    </div>

    <div><img src="#" alt="Não foi possível carregar a imagem" id="imagemMaior" /></div>

    <footer class="footer">
      <p>
        Created by Tixu ™
        <a href="https://github.com/viniciustixu" target="_blank"><img src="../imagens/favicon/icons8-github-100.png" alt="GitHub" /></a>
        <a href="https://twitter.com/viniciustixuu" target="_blank"><img src="../imagens/favicon/twitter.png" alt="Twitter" /></a>
      </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
